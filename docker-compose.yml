version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: orgiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orgiq
      POSTGRES_USER: orgiq
      POSTGRES_PASSWORD: orgiq_local
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: orgiq_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
